# =================================================================
# NGINX Configuration for Kaiser Management & VPN Bot System
# 
# 1. botroham.goodino24.ir    -> Angular Admin Management Panel & APIs
# 2. botrohamapi.goodino24.ir -> Bot Webhook & Backend APIs
# 3. Default (IP / Localhost) -> Complete Panel + APIs + Webhook Fallback
# =================================================================

# Global Proxy Settings
proxy_connect_timeout 300s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
client_max_body_size 64M;

# -----------------------------------------------------------------
# 1. Web Admin Panel: botroham.goodino24.ir
# -----------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name botroham.goodino24.ir;

    # ACME Challenge for Let's Encrypt SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/json application/xml image/svg+xml;

    # Backend APIs
    location /api {
        proxy_pass http://kaiser-backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger Documentation
    location /swagger {
        proxy_pass http://kaiser-backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Subscription, Payment, & Public Endpoints
    location ~* ^/(state|kaiser|onlinepay|pay|CallBackDataZipal|successpay|getUserService|getTest|createOrder|getCategory|getServerCat|getserverPlan) {
        proxy_pass http://kaiser-backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bot Webhook Proxy (accessible on panel domain as well)
    location /bot-webhook {
        proxy_pass http://kaiser-bot:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular SPA Frontend Web Application
    location / {
        proxy_pass http://kaiser-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# -----------------------------------------------------------------
# 2. API & Bot Webhook Subdomain: botrohamapi.goodino24.ir
# -----------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name botrohamapi.goodino24.ir;

    # ACME Challenge for Let's Encrypt SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/json application/xml image/svg+xml;

    # Telegram Bot Webhook Route
    location /bot-webhook {
        proxy_pass http://kaiser-bot:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Bot Diagnostic & Health Endpoints
    location ~* ^/(webhook-info|set-webhook|delete-webhook|health) {
        proxy_pass http://kaiser-bot:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All API, Subscription, and Payment Endpoints -> Kaiser Backend
    location / {
        proxy_pass http://kaiser-backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180;
    }
}

# -----------------------------------------------------------------
# 3. Default Fallback Server (Direct IP Address, Localhost, etc.)

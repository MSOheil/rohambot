    # Diagnostic & Health Endpoints -> kaiser-bot:3000
    location ~* ^/(webhook-info|set-webhook|delete-webhook|health) {
        proxy_pass http://kaiser-bot:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend APIs -> kaiser-backend:5000
    location /api {
        proxy_pass http://kaiser-backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180;
    }

    # Swagger Documentation
    location /swagger {
        proxy_pass http://kaiser-backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Subscription, Payment, & Custom Routes -> kaiser-backend:5000
    location ~* ^/(state|kaiser|onlinepay|pay|CallBackDataZipal|successpay|getUserService|getTest|createOrder|getCategory|getServerCat|getserverPlan) {
        proxy_pass http://kaiser-backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular Frontend (Default root for IP access) -> kaiser-frontend:80
    location / {
        proxy_pass http://kaiser-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =================================================================
# NGINX Configuration for Kaiser System
# Subdomains:
# 1. botrohamapi.goodino24.ir -> Bot Webhook & Backend API
# 2. botroham.goodino24.ir    -> Angular Admin Management Panel
# =================================================================

# 1. API & Bot Webhook Subdomain: botrohamapi.goodino24.ir
server {
    listen 80;
    listen [::]:80;
    server_name botrohamapi.goodino24.ir;

    # ACME Challenge for Let's Encrypt SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Telegram Bot Webhook Route
    location /bot-webhook {
        proxy_pass http://kaiser-bot:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # All API, Subscription, and Payment Endpoints -> Backend
    location / {
        proxy_pass http://kaiser-backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }
}

# 2. Web Admin Panel Subdomain: botroham.goodino24.ir
server {
    listen 80;
    listen [::]:80;
    server_name botroham.goodino24.ir;

    # ACME Challenge for Let's Encrypt SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Backend API calls from the Angular panel
    location /api/ {
        proxy_pass http://kaiser-backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger Documentation
    location /swagger/ {
        proxy_pass http://kaiser-backend:5000/swagger/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular SPA Web Application
    location / {
        proxy_pass http://kaiser-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Default Fallback Server (IP address, localhost, other hosts)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME Challenge for Let's Encrypt SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Bot Webhook
    location /bot-webhook {
        proxy_pass http://kaiser-bot:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend Endpoints
    location ~ ^/(kaiser|state|onlinepay|pay|CallBackDataZipal|successpay|getUserService|getTest|createOrder|getCategory|getServerCat|getserverPlan|api|swagger) {
        proxy_pass http://kaiser-backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular Frontend
    location / {
        proxy_pass http://kaiser-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
